$if(title)$
<header class="title-block">
<h1 class="title">$title$</h1>
$if(subtitle)$
<p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
<p class="author">$author$</p>
$endfor$
$if(date)$
<p class="date">$date$</p>
$endif$
</header>
$endif$
$if(abstract)$
<section class="abstract" role="doc-abstract">
<p class="abstract-title">$abstract-title$</p>
$abstract$
</section>
$endif$
$if(toc)$
<nav class="toc" role="doc-toc">
<h2 class="toc-title">$toc-title$</h2>
$table-of-contents$
</nav>
$endif$
$body$
