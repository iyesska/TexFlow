name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Ubuntu 24.04 installs Pandoc 3.1, the version the conversion is tested against
    # and the one the Docker image ships. Newer runners bring a Pandoc whose output
    # differs.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: texflow
          POSTGRES_PASSWORD: texflow
          POSTGRES_DB: texflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U texflow -d texflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The unit tests and the end-to-end tests each get a database of their own.
      TEST_DATABASE_URL: postgresql://texflow:texflow@localhost:5432/texflow_test
      E2E_DATABASE_URL: postgresql://texflow:texflow@localhost:5432/texflow_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Create the test databases
        run: |
          psql postgresql://texflow:texflow@localhost:5432/texflow \
            -c "CREATE DATABASE texflow_test" -c "CREATE DATABASE texflow_e2e"
      - name: Install Pandoc and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y pandoc bubblewrap
      # Ubuntu runners forbid unprivileged user namespaces, which bubblewrap needs.
      - name: Allow the sandbox to create namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Tectonic and its LaTeX packages
        run: sudo scripts/setup-tectonic.sh && sudo chmod -R a+rX /var/cache/texflow
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
